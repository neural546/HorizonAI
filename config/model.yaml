defaults:
  latent_channels: 4
  base_channels: 64
  channel_multipliers: [1, 2, 4]
  num_res_blocks: 2
  attention_heads: 4
  text_max_length: 32
  text_embed_dim: 256
  transformer_layers: 4
  transformer_heads: 8
  dropout: 0.1

profiles:
  low:
    image_size: 64
    num_frames: 8
    latent_channels: 4
    base_channels: 32
    channel_multipliers: [1, 2, 4]
    num_res_blocks: 1
    attention_heads: 4
    text_max_length: 32
    text_embed_dim: 128
    transformer_layers: 2
    transformer_heads: 4
    dropout: 0.1

  medium:
    image_size: 128
    num_frames: 16
    latent_channels: 4
    base_channels: 64
    channel_multipliers: [1, 2, 4]
    num_res_blocks: 2
    attention_heads: 4
    text_max_length: 64
    text_embed_dim: 256
    transformer_layers: 4
    transformer_heads: 8
    dropout: 0.1

  high:
    image_size: 256
    num_frames: 32
    latent_channels: 4
    base_channels: 128
    channel_multipliers: [1, 2, 4, 4]
    num_res_blocks: 3
    attention_heads: 8
    text_max_length: 128
    text_embed_dim: 512
    transformer_layers: 6
    transformer_heads: 8
    dropout: 0.1

vae:
  latent_channels: 4
  base_channels: 32
  downsample_factor: 8
