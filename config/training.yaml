defaults:
  epochs: 10
  learning_rate: 1.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  grad_clip: 1.0
  warmup_steps: 100
  log_every: 10
  save_every: 500
  num_workers: 2
  mixed_precision: false
  gradient_accumulation_steps: 1
  prompt_dropout_prob: 0.1
  scheduler_type: linear
  num_train_timesteps: 1000
  checkpoint_dir: AI/checkpoints
  log_dir: runs
  use_gradient_checkpointing: false

profiles:
  low:
    batch_size: 1
    learning_rate: 1.0e-4
    image_size: 64
    num_frames: 8
    mixed_precision: false
    gradient_accumulation_steps: 1
    use_gradient_checkpointing: true
    num_workers: 0

  medium:
    batch_size: 2
    learning_rate: 2.0e-4
    image_size: 128
    num_frames: 16
    mixed_precision: true
    gradient_accumulation_steps: 1
    use_gradient_checkpointing: false
    num_workers: 2

  high:
    batch_size: 8
    learning_rate: 3.0e-4
    image_size: 256
    num_frames: 32
    mixed_precision: true
    gradient_accumulation_steps: 1
    use_gradient_checkpointing: false
    num_workers: 4
