name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install tools
      run: |
        pip install black isort ruff

    - name: Ruff
      run: ruff check .

    - name: Black
      run: black . --check

    - name: Isort
      run: isort . --check-only
