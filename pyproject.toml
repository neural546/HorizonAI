[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "build", "dist", "__pycache__", "outputs", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 110
target-version = ["py311"]
extend-exclude = '''
/(\.venv|build|dist|__pycache__|outputs|runs)/
'''

[tool.isort]
profile = "black"
line-length = 110
skip_glob = ["*/.venv/*", "*/outputs/*", "*/runs/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
